function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0)}function home(){show("home")}
document.getElementById("scan").onclick=()=>show("scanner");document.getElementById("demo").onclick=()=>result();
document.getElementById("camera").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});video.srcObject=stream;check.disabled=false;status.textContent="Camera ready. Keep the product fully visible."}catch(e){status.textContent="Camera permission was blocked. Use CHOOSE A PHOTO."}};
document.getElementById("check").onclick=()=>result();document.getElementById("photo").onchange=e=>{if(e.target.files[0])result()};
function result(){speech=`${P.name}. Part number ${P.part}. Price 24 rupees per piece.`;resultCard.innerHTML=`<div style="color:#0b5cff;font-weight:800">PRODUCT MATCH</div><img class="productimg" src="${IMG}"><div class="name">${P.name}</div><div class="price">${P.price}</div><div class="detail"><b>Part No:</b> ${P.part}</div><div class="detail"><b>Category:</b> ${P.category}</div><p class="status">Demo result. The full version will compare the camera photo with all products from your PDF and uploaded images.</p>`;show("result")}
document.getElementById("speak").onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(speech))};
</script></body></html>
